{% include base_path %}

<!-- start custom head snippets -->

<!-- Fonts: Newsreader (serif, for titles) and Public Sans (sans-serif, for everything else) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Public+Sans:ital,wght@0,400..700;1,400..700&display=swap">

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon: University of Cambridge shield. Bump ?v= when the icon files change, or browsers keep showing the old one -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=2"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=2" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v=2" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=2"/>
<link rel="icon" href="/images/favicon.ico?v=2"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
